# Thread sizes offered in threading mode (F2 T), read at start-up. (lc.cfg's
# ThreadsFile setting can point to a different file.) Add or remove sizes
# here as needed; no recompilation is needed.
#
# A line starting with # is a comment. Each category starts with its name and
# thread form in square brackets:
#     [Metric coarse | ISO]
# The forms are ISO (metric, 60 degrees), UN (Unified: UNC, UNF etc, 60
# degrees), Whitworth (BSW, BSF, BSP etc, 55 degrees) and BA (47.5 degrees).
# The form sets the depths to cut and the bore for an internal thread, as
# fractions of the pitch (see threadpitches.cpp).
#
# Then one thread per line: name, major diameter, pitch
#   - the diameter in mm, or in inches with a " (e.g. 0.375" or 3/8")
#   - the pitch in mm, or in threads per inch with tpi (e.g. 16 tpi)
# (Names can't contain commas, and a name can't start with #.)

