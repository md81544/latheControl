# Configuration file for Lathe Control.
# For lathe:
#   Axis1 = Z Axis
#   Axis2 = X Axis

NumberOfAxes = 3

Axis1GpioStepPin = 8
Axis1GpioReversePin = 7
Axis1GpioEnablePin = 0
Axis1StepsPerRev = 1000
Axis1ConversionNumerator = -1
Axis1ConversionDivisor = 1000
Axis1MaxMotorRpm = 1000
Axis1BacklashCompensationSteps = 380
# The speed (mm/min) at which a move takes up the backlash, e.g. after a
# reversal (optional, off if not set; the same setting exists for Axis2).
# Without it, the take-up goes at the move's speed, and the nut then picks
# up the load all at once, which can stall the motor (see lc_mill.cfg)
#Axis1BacklashTakeUpSpeed = 100
Axis1MotorFlipDirection = false
# All speeds are in mm/minute
Axis1SpeedPreset1 = 20
Axis1SpeedPreset2 = 40
Axis1SpeedPreset3 = 100
Axis1SpeedPreset4 = 250
Axis1SpeedPreset5 = 800
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis1SpeedResetAbove = 100
Axis1SpeedResetTo = 40
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis1RampingSpeed = 80
# Deceleration ramping (optional, off unless set; the same settings exist for
# Axis2): every move slows down before it stops, rather than stopping dead
# from full speed, and a released rapid runs on while it slows. See
# lc_mill.cfg, where it's on
#Axis1DecelerationRamping = true
#Axis1DecelerationRampingSpeed = 80
# Motor driver alarm output (optional; e.g. ALM+ on a closed-loop driver,
# with ALM- to GND). If set, the motor stops as soon as the driver goes into
# alarm (e.g. after a stall), and won't move until the alarm is cleared and
# the axis re-zeroed (or its position set). ActiveLevel is the level the pin
# reads when in alarm: low or high. The same settings exist for Axis2
#Axis1AlarmPin =
#Axis1AlarmActiveLevel = low
# Limit switches (optional): one pin for all of them, which stops all the
# motors when any switch is pressed. Wire normally-closed switches in series
# from the pin to GND (the pin's pull-up is enabled): pressing any of them,
# or a broken wire or unplugged socket, then reads high, so stops the motors
# too. ActiveLevel is the level the pin reads when a switch is pressed: high
# (as above) or low. The motors refuse to move until the stop is cleared
# (a dialog asks, or the menu: System)
#LimitSwitchPin =
#LimitSwitchActiveLevel = high


Axis2GpioStepPin = 20
Axis2GpioReversePin = 21
Axis2GpioEnablePin = 0
Axis2StepsPerRev = 800
Axis2ConversionNumerator = -1
Axis2ConversionDivisor   = 2400
Axis2MaxMotorRpm = 400
Axis2BacklashCompensationSteps = 220
Axis2MotorFlipDirection = false
# All speeds are in mm/minute
Axis2SpeedPreset1 = 5
Axis2SpeedPreset2 = 20
Axis2SpeedPreset3 = 40
Axis2SpeedPreset4 = 80
Axis2SpeedPreset5 = 240
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis2SpeedResetAbove = 80
Axis2SpeedResetTo = 20
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis2RampingSpeed = 60

RotaryEncoderGpioPinA = 23
RotaryEncoderGpioPinB = 24
RotaryEncoderPulsesPerRev = 2000
RotaryEncoderGearingNumerator = 35
RotaryEncoderGearingDivisor = 100

# These are used to make the program suitable
# to control an X-axis on the mill. Axis1
# (the main axis, Z, on the lathe, can be renamed
# to X, and the RPM and Axis2 can be hidden.
DisableAxis1 = false
DisableAxis2 = false
DisableRpm = false
Axis1Label = Z
Axis2Label = X
# Axis Leader keys are specified by ASCII number
# Don't forget to use the lower case version
# unless you have good reason not to
Axis1Leader = 122
Axis2Leader = 120

# Motor threads run at real-time priority, spinning between steps. On a Pi
# dedicated to this program, give each its own CPU core (numbered from 0; a
# Pi has 0-3); everything else is then kept off those cores. Without this, a
# motor starting to move can starve other threads, e.g. pigpio's, which loses
# rotary encoder pulses (and so the thread position when threading)
Axis1CpuCore = 3
Axis2CpuCore = 2
# Keep the motor threads spinning when idle, rather than sleeping, so their
# cores stay theirs (and a move starts without waiting for a thread to wake)
MotorThreadsSpinWhenIdle = true

# When threading, cause automatic retraction toggle whenever
# the motor stops. This is only the setting at start-up: the menu's Modes
# turns it on and off
ThreadingAutoRetract = true

# Threading passes with a constant area: each pass goes in at least this much
# further than the one before (mm), so the last ones don't get ever smaller
ThreadingMinimumInfeed = 0.02

# Cut knurling: the spindle speed (rpm) to knurl at, e.g. the slowest it runs.
# The knurling dialog suggests the smallest helix angle whose lead Z can follow
# at this speed (a steeper angle has a shorter lead). Not set (or 0): 45
# degrees, unless that's too long a lead
KnurlingSpindleRpm = 70

# Which way X retracts at start-up: outwards (e.g. turning) or inwards (e.g.
# boring). The menu's retraction direction (Modes) changes it, as does
# choosing a male or female thread
Axis2RetractionDirection = outwards
# How far X retracts (R, and ThreadingAutoRetract), in mm of X travel (not on
# the diameter). When boring a small hole, keep it small enough that the back
# of the boring bar won't hit the far side
Axis2RetractionDistance = 2.0

# Multi-pass: when its dialog's retract (R) is "Last N passes", how many
# passes at the end retract. The roughing passes before them return without
# retracting, which is quicker; only the finishing ones need to
MultiPassRetractLastPasses = 2
# Multi-pass and threading passes: rather than retracting by
# Axis2RetractionDistance, X retracts to this far (in mm) beyond the start,
# where the tool touched the work. That's clear of all the work however deep
# the passes have gone, and in a bore, it only moves the back of the boring
# bar this much nearer the far side than it was at the start. Also used
# before moving to the start, and for spring passes
MultiPassRetractClearance = 0.25

# EXPERIMENTAL: correcting a lathe which turns a slight taper. An angle in
# degrees, as for taper mode (negative: X moves to make the work wider
# towards the chuck), added to every taper, and made as a tiny taper on each
# multi-pass cut (with X shown as if it weren't). Not yet applied anywhere
# else (e.g. a manual Z feed, or threading). If a plain cut measures dFar
# (away from the chuck) and dNear (towards it), L mm apart:
#   TaperCorrection = -atan((dFar - dNear) / (2 * L)), in degrees
# e.g. 15.315 and 15.277, 23.4 mm apart: about -0.047. If a test cut's
# taper doubles rather than going, the sign is the wrong way round
TaperCorrection = 0

# The current feature: a remembered diameter (of the surface being worked on)
# and Z (of the work's end, e.g. after facing), shown on screen, and offered
# as a multi-pass start (see the README). For a lathe; off if not set
CurrentFeature = true
# How far off the work's end (in Z, away from the work) a multi-pass started
# from the current feature begins, and the menu's "clear of the end" moves go
# to, in mm
FeatureStartClearance = 0.5
# Which way Z's position goes as the carriage moves towards the chuck:
# negative or positive. ("Clear of the work's end" is the other way)
Axis1TowardsChuck = negative

# The tool library: tools measured from the reference tool (tool 1), so that
# changing tool shifts the positions by the difference between their offsets
# (see the README). For a lathe; off if not set. It's kept in ToolLibraryFile
# (relative to where lc is run), which the program writes, keeping the one
# before as .bak
ToolLibrary = true
ToolLibraryFile = tools.cfg

# Gear cutting mode, for a rotary table as axis 2 (see lc_mill.cfg). Off if
# not set
#GearCutting = false

# Modes which make no sense on this machine. They're left out of the menu
# (Modes), and their keys are ignored. Any of threading (with its passes and
# auto-retract), taper, chamfer (the quick chamfer, H), multipass and
# knurling, separated by commas. None if not set (see lc_mill.cfg)
#DisabledModes =

# The thread sizes offered in threading mode (relative to where lc is run)
ThreadsFile = threadpitches.cfg

# A linear scale on axis 1 (optional; only axis 1 can have one so far):
# none (the default), quadrature (read on two GPIO pins, as here), or serial
# (one axis of the mill's DRO sender; see lc_mill.cfg). Its position is shown
# on the axis's row, with its difference from the motor's position,
# which shows any lost steps (or a wrong backlash setting). Each time the
# axis stops, lc.log records the difference once the reading has settled.
# Positions still come from the motor's step count
Axis1Scale = quadrature
Axis1ScaleGpioPinA = 5
Axis1ScaleGpioPinB = 6
Axis1ScaleCountsPerMm = 200
# True if the scale counts down as the motor's position goes up
Axis1ScaleReversed = false
# The reading counts as settled once it's been steady for this long after
# the axis stops, or after the longer time if it keeps changing
#Axis1ScaleSettleMs = 500
#Axis1ScaleMaxSettleMs = 3000
# Each time the axis stops and the reading settles, the scale is compared
# with the motor. Further apart than this (in mm; 0, the default, is off),
# everything stops, and a dialog asks which to believe: e.g. after a stall,
# the scale. If the table has gone further than the motor, the way it was
# moving (carrying on into the slack when stopped dead from speed), the
# backlash setting is allowed on top. (Check the scale's sign,
# Axis1ScaleReversed, first)
#Axis1ScaleWarnMm = 0.2
# A scale can misread (e.g. interference). A jump in the reading at rest of
# more than this (in mm; 0, the default, is off) can't be the table moving,
# with the motor holding it, so everything stops at once, and a dialog says
# the scale is misreading: the position shown is kept, and the scale lined up
# with it again. (Re-basing, finishing moves on the scale and the dialog's
# Y only ever use a reading which has settled properly, whether or not this
# is set)
#Axis1ScaleFaultMm = 5
# While the axis moves, the reading is watched too. A reading may lag the
# table (the mill's DRO sender averages about a second of readings): it's
# taken to be the average of where the table was over this long, in ms (0, the
# default, for a scale whose reading doesn't lag)
#Axis1ScaleLagMs = 0
# The table further behind the motor than this while moving (in mm, allowing
# for the lag; 0, the default, is off) means the motor has stalled:
# everything stops at once, rather than when the move ends, and once the
# reading has settled, it's checked as usual (see Axis1ScaleWarnMm)
#Axis1ScaleStallMm = 3
# The reading changing faster than the table can move, or getting further
# ahead of the motor than this while moving (in mm, allowing for the lag; 0,
# the default, is off), means the scale is misreading, as for
# Axis1ScaleFaultMm. lc.log's settle lines give how far behind and ahead the
# reading got on each move, to check these against
#Axis1ScaleMovingFaultMm = 3
# Closer than that (by a count or more), set the motor's position from the
# scale's, so the position follows where the tool really is, whatever the
# backlash. Not in threading, taper and the other lathe modes, nor part way
# through a multi-pass. Off unless set
#Axis1ScaleRebase = false
# In a multi-pass (or gear cutting), before each cut, wait for the reading to
# settle after the return (about the settle time, each pass), then re-base the
# same way, and move the axis to the pass's start from where the scale says it
# is: a drift or lost steps don't build up from pass to pass, paused or not,
# and a mismatch (Axis1ScaleWarnMm) stops everything at the next pass. Also
# re-bases while paused. (Not threading, knurling or a radius.) Independent of
# Axis1ScaleRebase. Off unless set
#Axis1ScaleRebaseBetweenPasses = false
# Finish positioning moves (go to a memory, a typed or relative position, or
# the last position) on the scale: once the reading has settled, if the tool
# is more than a count from the target, correct, approaching the same way as
# the move (backing off past the backlash if it went past). About 2 s or more
# after each such move. Not jogs, nudges or fast returns, nor in a multi-pass
# or the lathe's modes. This is how it starts; the menu (System) turns it on
# and off. Off unless set
#Axis1ScaleFinishMoves = false
# The approach (optional, off unless set): a move finished on the scale (and,
# with AxisNScaleRebaseBetweenPasses, a multi-pass's moves: axis 2's feed,
# and axis 1's cut, return and move to a pass's start) stops
# this far short of its target, waits for the scale, then creeps the rest at
# Axis1ScaleApproachSpeed (mm/min; 20 if not set), the same way. So the last
# of it never reverses (so the backlash compensation, and its error, don't
# come into it), has next to no momentum, and leaves the slack taken up the
# way the tool goes into the work: it never ends past its target, which a
# correction afterwards can't undo if the tool is in the work. Make it more
# than the table can overshoot by (e.g. the variation in the backlash, and
# the lead screw's error over a long move: see lc_mill.cfg). Each
# such move waits for the scale once more
#Axis1ScaleApproachMm = 0.2
#Axis1ScaleApproachSpeed = 20

# A scale on axis 2 (optional; planned for X, once Z's is proven): the same
# keys as axis 1's, with Axis2 in place of Axis1, and the same checks.
# Axis2ScaleRebaseBetweenPasses re-bases X after each feed of a multi-pass,
# feeding again if that shows it short of (or past) the pass's depth, so
# each pass is cut at the depth the scale says. A quadrature scale on axis 2
# must have its pins set (axis 1's default to 5 and 6). If both axes disagree
# with their scales at once, one dialog asks about both. (The pins below are
# only examples, free on this Pi)
#Axis2Scale = quadrature
#Axis2ScaleGpioPinA = 13
#Axis2ScaleGpioPinB = 19
#Axis2ScaleCountsPerMm = 200
#Axis2ScaleReversed = false
#Axis2ScaleWarnMm = 0.2
#Axis2ScaleRebase = false
#Axis2ScaleRebaseBetweenPasses = false
#Axis2ScaleFinishMoves = false
#Axis2ScaleApproachMm = 0.2
#Axis2ScaleApproachSpeed = 20

# Axes moved by hand (optional; axes 3 and 4, e.g. the mill's Y and Z: see
# lc_mill.cfg). The lathe has none. Each is shown on a line of its own, as on
# a DRO, read from its scale (which it must have), and can be zeroed, set and
# halved with its leader key. Its leader then G goes to a position, wound by
# hand, as for a memory slot (below). Nothing moves them. Their zeros aren't
# kept when lc stops, nor when the scale's readings are lost. The scale keys
# are as for axis 1's (Axis3Scale, Axis3ScaleSerialLetter,
# Axis3ScaleCountsPerMm, Axis3ScaleReversed, and so on), but there's no "none"
#Axis3Kind = manual
#Axis3Label = Y
# (No leader key unless set)
#Axis3Leader = 121
# Each is in the memory slots too: its leader key then m stores it, Enter goes
# to it (wound by hand, with the distance to go shown on its line), and Delete
# clears it. Going to a slot on every axis (\ then Enter) includes it, unless
# this is false (e.g. the mill's Z, which isn't moved while X is)
#Axis3InSlotGoTo = true
# A go-to ends once the reading has stayed within a count of where it is for
# this long (ms), within two counts of the target. A sender which averages
# its readings (as the mill's does) needs longer
#Axis3ScaleSettleMs = 500
# Whether winding its handle clockwise makes its position go up. If set, a
# go-to's line says which way to wind ("clockwise" or "anticlockwise").
# Nothing is said if not set
#Axis3ClockwiseIncreases = true

# FOR TESTING ONLY:
# Make this a low number (e.g. 1) to get
# maximum rpm of the mock chuck.
MockRotaryEncoderDelayMicroseconds = 500
# Set this to false to make the mock chuck run backwards
MockRotaryDirectionNormal = true

# Joystick / gamepad device (Linux only). This is the default; it is
# picked up automatically when plugged in
#JoystickDevice = /dev/input/js0
# Two gamepad buttons which, pressed together, open (or close) the menu.
# This is the default (previous + next memory slot). Their own actions then
# happen when released (or after 150ms if held). "none" to turn it off
#JoystickMenuChord = 4,6

# Sounds (optional), played from the monitor's HDMI output with the player
# below: SoundAlert when the program is waiting for you (a multi-pass pausing
# between passes, finishing, or arriving at its start), and SoundAlarm when
# something goes wrong (a motor fault, a limit switch, the scale disagreeing
# with the motor, or a warning which appears by itself). Ordinary dialogs
# have none. Each is off if not set. The files are relative to where lc is
# run from. The player is "aplay -q" by default ("afplay" on a Mac), with
# the file added at the end. On the Pi, turn off PipeWire's suspend of the
# HDMI output, or the start of a sound can be lost (see README.md)
SoundAlert = sounds/alert.wav
SoundAlarm = sounds/alarm.wav
# SoundTick (optional; for axes moved by hand, so not the lathe's) ticks as
# you wind a manual axis towards a memory slot (its leader then Enter),
# faster as it gets closer, then plays SoundAlert once it's close: from
# there, read the figures. The ticks start within SoundTickStartMm of the
# target (2 mm unless set), or SoundTickStartSeconds from it at the speed
# you're winding (1 s), whichever comes first, SoundTickSlowestMs apart
# (500 ms). They get faster in proportion, so twice as close is twice as
# fast, up to 20 a second. The alert plays within SoundTickNearMm (0.2 mm)
# or once past the target. Off if not set
#SoundTick = sounds/tick.wav
#SoundTickStartMm = 2
#SoundTickStartSeconds = 1
#SoundTickNearMm = 0.2
#SoundTickSlowestMs = 500
#SoundPlayer = aplay -q
