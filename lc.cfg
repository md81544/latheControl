# Configuration file for Lathe Control.
# For lathe:
#   Axis1 = Z Axis
#   Axis2 = X Axis

NumberOfAxes = 3

Axis1GpioStepPin = 8
Axis1GpioReversePin = 7
Axis1GpioEnablePin = 0
Axis1StepsPerRev = 1000
Axis1ConversionNumerator = -1
Axis1ConversionDivisor = 1000
Axis1MaxMotorRpm = 1000
Axis1BacklashCompensationSteps = 380
Axis1MotorFlipDirection = false
# All speeds are in mm/minute
Axis1SpeedPreset1 = 20
Axis1SpeedPreset2 = 40
Axis1SpeedPreset3 = 100
Axis1SpeedPreset4 = 250
Axis1SpeedPreset5 = 800
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis1SpeedResetAbove = 100
Axis1SpeedResetTo = 40
# If this is set to true, then all position reporting
# will come from the linear scale, not the motor's step count
Axis1UseLinearScale = false
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis1RampingSpeed = 80
# Motor driver alarm output (optional; e.g. ALM+ on a closed-loop driver,
# with ALM- to GND). If set, the motor stops as soon as the driver goes into
# alarm (e.g. after a stall), and won't move until the alarm is cleared and
# the axis re-zeroed (or its position set). ActiveLevel is the level the pin
# reads when in alarm: low or high. The same settings exist for Axis2
#Axis1AlarmPin =
#Axis1AlarmActiveLevel = low


Axis2GpioStepPin = 20
Axis2GpioReversePin = 21
Axis2GpioEnablePin = 0
Axis2StepsPerRev = 800
Axis2ConversionNumerator = -1
Axis2ConversionDivisor   = 2400
Axis2MaxMotorRpm = 400
Axis2BacklashCompensationSteps = 220
Axis2MotorFlipDirection = false
# All speeds are in mm/minute
Axis2SpeedPreset1 = 5
Axis2SpeedPreset2 = 20
Axis2SpeedPreset3 = 40
Axis2SpeedPreset4 = 80
Axis2SpeedPreset5 = 240
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis2SpeedResetAbove = 80
Axis2SpeedResetTo = 20
# See Axis1UseLinearScale. This is currently not implemented
Axis2UseLinearScale = false
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis2RampingSpeed = 60

RotaryEncoderGpioPinA = 23
RotaryEncoderGpioPinB = 24
RotaryEncoderPulsesPerRev = 2000
RotaryEncoderGearingNumerator = 35
RotaryEncoderGearingDivisor = 100

# To counter a lathe cutting an unwanted taper,
# you can specify an angle here, which will cause
# the X-axis to start moving slightly together
# with the Z-axis. Negative angles move the
# tool inwards as it approaches the chuck (i.e.
# corrects a larger resultant diameter at the
# chuck end)  (TODO! Not yet supported)
LatheMisalignmentCorrectionTaper = -0.045

# These are used to make the program suitable
# to control an X-axis on the mill. Axis1
# (the main axis, Z, on the lathe, can be renamed
# to X, and the RPM and Axis2 can be hidden.
DisableAxis1 = false
DisableAxis2 = false
DisableRpm = false
Axis1Label = Z
Axis2Label = X
# Axis Leader keys are specified by ASCII number
# Don't forget to use the lower case version
# unless you have good reason not to
Axis1Leader = 122
Axis2Leader = 120

# Motor threads run at real-time priority, spinning between steps. On a Pi
# dedicated to this program, give each its own CPU core (numbered from 0; a
# Pi has 0-3); everything else is then kept off those cores. Without this, a
# motor starting to move can starve other threads, e.g. pigpio's, which loses
# rotary encoder pulses (and so the thread position when threading)
Axis1CpuCore = 3
Axis2CpuCore = 2
# Keep the motor threads spinning when idle, rather than sleeping, so their
# cores stay theirs (and a move starts without waiting for a thread to wake)
MotorThreadsSpinWhenIdle = true

# When threading, cause automatic retraction toggle whenever
# the motor stops
ThreadingAutoRetract = true

# Which way X retracts at start-up: outwards (e.g. turning) or inwards (e.g.
# boring). F2 R changes it, as does choosing a male or female thread
Axis2RetractionDirection = outwards

# EXPERIMENTAL: correcting a lathe which turns a slight taper. An angle in
# degrees, as for taper mode (negative: X moves to make the work wider
# towards the chuck), added to every taper, and made as a tiny taper on each
# multi-pass cut (with X shown as if it weren't). Not yet applied anywhere
# else (e.g. a manual Z feed, or threading). If a plain cut measures dFar
# (away from the chuck) and dNear (towards it), L mm apart:
#   TaperCorrection = -atan((dFar - dNear) / (2 * L)), in degrees
# e.g. 15.315 and 15.277, 23.4 mm apart: about -0.047. If a test cut's
# taper doubles rather than going, the sign is the wrong way round
TaperCorrection = 0

# The thread sizes offered in threading mode (relative to where lc is run)
ThreadsFile = threadpitches.cfg

# Linear scale reading. LinearScale1 equates to Axis1 (lathe's Z axis)
# So far only one linear scale is supported.
LinearScaleAxis1GpioPinA = 5
LinearScaleAxis1GpioPinB = 6
LinearScaleAxis1StepsPerMM = 200

# FOR TESTING ONLY:
# Make this a low number (e.g. 1) to get
# maximum rpm of the mock chuck.
MockRotaryEncoderDelayMicroseconds = 500
# Set this to false to make the mock chuck run backwards
MockRotaryDirectionNormal = true

# Joystick / gamepad device (Linux only). This is the default; it is
# picked up automatically when plugged in
#JoystickDevice = /dev/input/js0
# Two gamepad buttons which, pressed together, open (or close) the menu.
# This is the default (previous + next memory slot). Their own actions then
# happen when released (or after 150ms if held). "none" to turn it off
#JoystickMenuChord = 4,6
