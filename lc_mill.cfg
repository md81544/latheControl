# Configuration file for Mill Control.
# For mill:
#   Axis1 = X Axis
#   Axis2 = Rotary Table (A: it stands vertically, turning about X)

Axis1GpioStepPin = 10
Axis1GpioReversePin = 9
Axis1GpioEnablePin = 0
# The mill goes 2mm per revolution on the X leadscrew
# The gearing for the stepper is 25:40 i.e. 1.6
# hence the divisor of 6400
Axis1StepsPerRev = 4000
Axis1ConversionNumerator = 2
Axis1ConversionDivisor = 6400
Axis1MaxMotorRpm = 800
Axis1BacklashCompensationSteps = 1420
Axis1MotorFlipDirection = true
Axis1SpeedPreset1 = 20
Axis1SpeedPreset2 = 100
Axis1SpeedPreset3 = 200
Axis1SpeedPreset4 = 300
Axis1SpeedPreset5 = 800
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis1SpeedResetAbove = 200
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis1RampingSpeed = 40
# X's scale, read from the DRO sender (the box which sends the scales'
# readings to TouchDRO), through a USB-serial adapter listening to its
# Arduino's TX. See hardware/touchdro-sender/README.md, and the scale keys in
# lc.cfg
Axis1Scale = serial
Axis1ScaleSerialDevice = /dev/ttyUSB0
Axis1ScaleSerialLetter = X
# The scales nominally give 2560 counts per inch, but X was calibrated in
# TouchDRO with a DTI as 2556 (2556 / 25.4). That agrees with the motor's
# 100 mm to within about 0.05 mm, where 2560 read 0.11 mm short
Axis1ScaleCountsPerMm = 100.6299
# The scale counts up as the table moves right, which is X's negative
# direction here (found on the mill, 13 Nov 2026)
Axis1ScaleReversed = true
# The sender's smoothing only reaches the true reading once the scale has
# been steady for a whole second (24 readings), so wait longer than that
Axis1ScaleSettleMs = 1500

# Rotary Table (A)
Axis2GpioStepPin = 20
Axis2GpioReversePin = 21
Axis2GpioEnablePin = 0
Axis2StepsPerRev = 4000
# One rotation on my rotary table is 5°:
Axis2ConversionNumerator = 5
Axis2ConversionDivisor = 4000
Axis2MaxMotorRpm = 640
Axis2BacklashCompensationSteps = 1024
Axis2MotorFlipDirection = false
Axis2DisplayUnits = deg
Axis2SpeedPreset1 = 25
Axis2SpeedPreset2 = 100
Axis2SpeedPreset3 = 250
Axis2SpeedPreset4 = 400
Axis2SpeedPreset5 = 640
Axis2SpeedResetAbove = 400

DisableAxis1 = false
DisableAxis2 = false
DisableRpm = true
Axis1Label = X
Axis2Label = A
# Axis Leader keys are specified by ASCII number
# Don't forget to use the lower case version
# unless you have good reason not to
# (A's leader is c, as a is X's nudge to the left)
Axis1Leader = 120
Axis2Leader = 99

# Gear cutting mode (Modes, "Gear cutting"): cuts each tooth along X, turning
# the rotary table (axis 2, which must be in degrees) on by a tooth between
# cuts, at A's full speed. The depth is fed by hand. Off if not set
GearCutting = true
