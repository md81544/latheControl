# Configuration file for Mill Control.
# For mill:
#   Axis1 = X Axis
#   Axis2 = Rotary Table (A: it stands vertically, turning about X)

Axis1GpioStepPin = 10
Axis1GpioReversePin = 9
Axis1GpioEnablePin = 0
# The mill goes 2mm per revolution on the X leadscrew
# The gearing for the stepper is 25:40 i.e. 1.6
# hence the divisor of 6400
Axis1StepsPerRev = 4000
Axis1ConversionNumerator = 2
Axis1ConversionDivisor = 6400
Axis1MaxMotorRpm = 800
Axis1BacklashCompensationSteps = 820
# The speed (mm/min) at which a move takes up the backlash, e.g. after a
# reversal (optional; the same setting exists for Axis2). Without it, the
# take-up goes at the move's speed (a fast return starts at 40% of the
# maximum), and the nut then picks up the table all at once, with a "clunk":
# X stalled on about one reversal in six that way (18 Nov 2026, by hand as
# well as on multi-pass returns). With it, the take-up goes at this speed,
# and the move then ramps up from rest as usual. Tried on 18 Nov 2026:
# 40 multi-pass passes without a stall, where five or more were expected
Axis1BacklashTakeUpSpeed = 100
Axis1MotorFlipDirection = true
Axis1SpeedPreset1 = 20
Axis1SpeedPreset2 = 100
Axis1SpeedPreset3 = 200
Axis1SpeedPreset4 = 300
Axis1SpeedPreset5 = 800
# Speed above which the speed will be reset lower
# automatically when the stepper stops, to avoid
# accidental fast motion on the restart
Axis1SpeedResetAbove = 200
# Ramping Speed 0-100. 0=no ramp, 1=slowest ramp, 100=default ramp speed.
Axis1RampingSpeed = 40
# Deceleration ramping (optional, off unless set; the same settings exist for
# Axis2): every move slows down before it stops, to the speed the ramp starts
# at (40% of Axis1MaxMotorRpm: 320 rpm, or 400 mm/min, here), at the rate set
# by Axis1DecelerationRampingSpeed (0-100, like Axis1RampingSpeed, which it
# defaults to). A released rapid, or a jog stopped with its key, runs on while
# it slows (about 2.5 mm from 800 mm/min at 40; about 1 mm at 100); Space
# still stops everything at once. Added on 18 Nov 2026, as stopping dead from
# 800 mm/min carried X on by about 0.1 mm each time, but stopping from
# 400 mm/min didn't. Tried on 18 Nov 2026: multi-pass at 800 mm/min with no
# drift, and released rapids slow down manageably
Axis1DecelerationRamping = true
#Axis1DecelerationRampingSpeed = 40
# X's scale, read from the DRO sender (the box which sends the scales'
# readings to TouchDRO), through a USB-serial adapter listening to its
# Arduino's TX. See hardware/touchdro-sender/README.md, and the scale keys in
# lc.cfg
Axis1Scale = serial
Axis1ScaleSerialDevice = /dev/ttyUSB0
Axis1ScaleSerialLetter = X
# The scales nominally give 2560 counts per inch, but X was calibrated in
# TouchDRO with a DTI as 2556 (2556 / 25.4). That agrees with the motor's
# 100 mm to within about 0.05 mm, where 2560 read 0.11 mm short
Axis1ScaleCountsPerMm = 100.6299
# The scale counts up as the table moves right, which is X's negative
# direction here (found on the mill, 13 Nov 2026)
Axis1ScaleReversed = true
# The sender's smoothing only reaches the true reading once the scale has
# been steady for a whole second (24 readings), so wait longer than that
Axis1ScaleSettleMs = 1500
# Rely on the scale (see lc.cfg): each time X stops, its position is set from
# the scale's, unless they're more than 0.2 mm apart, which stops everything
# and asks which to believe. (X's backlash varies along the table, from 0.31
# to 0.45 mm, so no one backlash setting is right everywhere)
Axis1ScaleWarnMm = 0.2
Axis1ScaleRebase = true
# And before each pass of a multi-pass (or gear cutting), paused or not: X
# once drifted 4.5 mm over 39 passes with nothing to catch it (18 Nov 2026).
# Each pass waits for the scale to settle, about 2 s
Axis1ScaleRebaseBetweenPasses = true
# With the lathe running, X's reading once jumped by hundreds of mm at a time
# for half an hour (15 Nov 2026). The table can't move 5 mm at rest, so that's
# a misread (see lc.cfg)
Axis1ScaleFaultMm = 5
# And while moving (see lc.cfg). X stalled at the right-hand end of the table
# on rapids, counting up to 29 mm while the table stayed put (19 Nov 2026), and
# the reading once got 5 mm ahead of the motor during a rapid (a misread, it
# seems). The lag was first set to 1000, from the reading still changing for
# 0.7-0.9 s after a stop, but that's the last count or two creeping in: the
# bulk of a move shows within about 0.2 s. With 1000, the misread check went
# off on every rapid. Four rapids at 800 mm/min (19 Nov 2026) put the reading
# 1.0-1.6 mm behind the motor, a box average of 150-245 ms: so 200, which is
# within 0.3 mm of all four. Tried on 19 Nov 2026: rapids no longer set it off
Axis1ScaleLagMs = 200
Axis1ScaleStallMm = 3
Axis1ScaleMovingFaultMm = 3
# And finish positioning moves on the scale (see lc.cfg; the menu's System
# category turns it off, e.g. to save the dwell at a pocket's end walls)
Axis1ScaleFinishMoves = true
# A move finished on the scale stops this far short, waits for the scale,
# then creeps the rest at this speed (mm/min), the same way (see lc.cfg). So
# it never ends past its target, e.g. into a pocket's end wall: X's table can
# go about 0.1 mm further than the motor on a reversal, as its backlash
# varies (0.31-0.45 mm) and the compensation can't. With
# Axis1ScaleRebaseBetweenPasses (above), a multi-pass's (or gear cutting's)
# cuts and returns do the same at each end, so each pass waits for the scale
# twice, about 4 s in all (rather than once), with a 2 s dwell before the
# cut's end. Decided on 20 Nov 2026, with 0.2 mm. Tried on 21 Nov 2026: a
# multi-pass along -97 to 0 mm, at 140 mm/min and 800 mm/min, ended each
# 97 mm move 0.11-0.22 mm further than the motor, at any speed (and 0.25 mm on
# a fast return to a slot there), so 0.2 often went past the target. Short
# moves end within about 0.05 mm, and the same length elsewhere on the table
# (-62 to 35 mm) only 0.04-0.09 mm, so it seems to be the lead screw's pitch
# varying along its length, which the scale takes care of. So 0.35, which is
# 0.1 mm more than any seen: about 0.5 s more creeping at each end of a pass
Axis1ScaleApproachMm = 0.35
Axis1ScaleApproachSpeed = 20

# Rotary Table (A)
Axis2GpioStepPin = 20
Axis2GpioReversePin = 21
Axis2GpioEnablePin = 0
Axis2StepsPerRev = 4000
# One rotation on my rotary table is 5°:
Axis2ConversionNumerator = 5
Axis2ConversionDivisor = 4000
Axis2MaxMotorRpm = 640
Axis2BacklashCompensationSteps = 1024
Axis2MotorFlipDirection = false
Axis2DisplayUnits = deg
Axis2SpeedPreset1 = 25
Axis2SpeedPreset2 = 100
Axis2SpeedPreset3 = 250
Axis2SpeedPreset4 = 400
Axis2SpeedPreset5 = 640
Axis2SpeedResetAbove = 400

DisableAxis1 = false
DisableAxis2 = false
DisableRpm = true
Axis1Label = X
Axis2Label = A
# Axis Leader keys are specified by ASCII number
# Don't forget to use the lower case version
# unless you have good reason not to
# (A's leader is c, as a is X's nudge to the left)
Axis1Leader = 120
Axis2Leader = 99

# Y and Z (axes 3 and 4), which are moved by hand, read from the same DRO
# sender as X, and shown as on a DRO: their leader keys (y and z) then z to
# zero, s to set, or h to halve (to find a centre). Nothing moves them. Their
# zeros aren't kept when lc stops, as on TouchDRO, nor if the readings are
# lost (e.g. the sender is switched off, which starts its count again).
# The counts per mm are the scales' nominal 2560 counts per inch. Y's was
# checked on 20 Nov 2026: a 12.7 mm gauge block, edge-found from both sides
# with a 4 mm wiggler, read 12.71. (Before that, Y read about 0.3 mm over,
# because the M3 bolt holding its read head to the scale had worked loose
# and the head could move about 0.5 mm. That over-read looked like a wrong
# scale factor, but it wasn't, so check the scale's mounting first if a
# reading looks wrong.) Z's was checked the same day: a step measured as
# 24.66 mm, touched off on both surfaces with a digital edge finder, read
# 24.66. The directions follow the
# usual convention: Z goes down (more negative) as the tool moves towards the
# work, so Z's scale, which counts up as it goes down, is reversed (seen on
# the mill on 18 Nov 2026). Y's direction is not yet checked
Axis3Kind = manual
Axis3Label = Y
Axis3Leader = 121
Axis3Scale = serial
Axis3ScaleSerialLetter = Y
Axis3ScaleCountsPerMm = 100.7874
Axis3ScaleReversed = true
Axis4Kind = manual
Axis4Label = Z
Axis4Leader = 122
Axis4Scale = serial
Axis4ScaleSerialLetter = Z
Axis4ScaleCountsPerMm = 100.7874
Axis4ScaleReversed = true
# In the memory slots, but going to a slot on every axis (\ then Enter)
# leaves Z out: it's never moved while X is. (z then Enter still goes to Z's
# by itself.) The sender averages its readings, so settling takes about as
# long as X's (Axis1ScaleSettleMs)
Axis4InSlotGoTo = false
Axis3ScaleSettleMs = 1500
Axis4ScaleSettleMs = 1500
# Which way winding each handle clockwise moves the axis (true if its
# position goes up), so a go-to can say which way to wind. Not yet set: check
# on the mill, then uncomment
Axis3ClockwiseIncreases = false
#Axis4ClockwiseIncreases = true

# Each motor thread on its own CPU core, with everything else kept off them,
# and spinning when idle, as on the lathe (see lc.cfg). Added on 14 Nov 2026,
# after the Pi locked up once: probably not the cause, but it rules out a
# real-time motor thread sharing core 0, which handles the Pi's interrupts
Axis1CpuCore = 3
Axis2CpuCore = 2
MotorThreadsSpinWhenIdle = true

# Gear cutting mode (Modes, "Gear cutting"): cuts each tooth along X, turning
# the rotary table (axis 2, which must be in degrees) on by a tooth between
# cuts, at A's full speed. The depth is fed by hand. Off if not set
GearCutting = true

# Modes which make no sense on the mill, as it has no spindle to follow and
# its second axis is a rotary table. They're left out of the menu (Modes),
# and their keys are ignored. Any of threading (with its passes and
# auto-retract), taper, chamfer (the quick chamfer, H), multipass and
# knurling, separated by commas. None if not set
DisabledModes = threading, taper, chamfer, knurling

# Sounds (optional), played from the monitor's HDMI output with the player
# below: SoundAlert when the program is waiting for you (a multi-pass pausing
# between passes, finishing, or arriving at its start), and SoundAlarm when
# something goes wrong (a motor fault, a limit switch, the scale disagreeing
# with the motor, or a warning which appears by itself). Ordinary dialogs
# have none. Each is off if not set. The files are relative to where lc is
# run from. The player is "aplay -q" by default ("afplay" on a Mac), with
# the file added at the end. On the Pi, turn off PipeWire's suspend of the
# HDMI output, or the start of a sound can be lost (see README.md)
SoundAlert = sounds/alert.wav
SoundAlarm = sounds/alarm.wav
# SoundTick (optional; for axes moved by hand, so not the lathe's) ticks as
# you wind a manual axis towards a memory slot (its leader then Enter),
# faster as it gets closer, then plays SoundAlert once it's close: from
# there, read the figures. The ticks start within SoundTickStartMm of the
# target (2 mm unless set), or SoundTickStartSeconds from it at the speed
# you're winding (1 s), whichever comes first, SoundTickSlowestMs apart
# (500 ms). They get faster in proportion, so twice as close is twice as
# fast, up to 20 a second. The alert plays within SoundTickNearMm (0.1 mm)
# or once past the target. Off if not set
SoundTick = sounds/tick.wav
#SoundTickStartMm = 2
#SoundTickStartSeconds = 1
#SoundTickNearMm = 0.1
#SoundTickSlowestMs = 500
#SoundPlayer = aplay -q
